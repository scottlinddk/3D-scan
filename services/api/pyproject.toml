[project]
name = "scan3d-api"
version = "0.0.0"
description = "HTTP API for the 3d-scan service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scan3d_api"]
