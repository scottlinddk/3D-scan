[project]
name = "scan3d-reconstructor"
version = "0.0.0"
description = "Mac worker that turns photo sets into meshes via Apple Object Capture."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "scan3d-pipeline"]

[project.scripts]
scan3d-reconstructor = "scan3d_reconstructor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scan3d_reconstructor"]

[tool.uv.sources]
scan3d-pipeline = { workspace = true }
